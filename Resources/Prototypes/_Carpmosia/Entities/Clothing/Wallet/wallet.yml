
# base
- type: entity
  parent: [Clothing, BaseStorageItem]
  id: Wallet
  name: wallet
  description: Never leave the station without it!
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,1
  - type: Clothing
    slots: [belt]
  - type: Storage
    grid:
    - 0,0,2,1
    whitelist:
      components:
      - Currency  # salvage tickets, speso
      - Paper  # idk you can probaly shove a sheet of paper or note in there??
    maxItemSize: Small
  - type: Sprite  # idk sure whatever
    sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet.rsi
    storedSprite:
      state: icon
      sprite: _Carpmosia/Clothing/Wallet/Wallets/wallet.rsi
    state: icon
  - type: ItemMapper
    sprite: &WalletOverlay _Carpmosia/Clothing/Wallet/Wallets/wallet_overlays.rsi
    mapLayers:
      paper:
        whitelist:
          components:
          - Paper
      ticket:
        whitelist:
          tags:
          - SalvageTicket
      speso:
        whitelist:
          components:
          - Cash
  - type: UseDelay
    delay: 0.5
  - type: Appearance


